name: campus-assistant

services:
  campus-app:
    build: .
    container_name: campus-app
    ports:
      - "8080:8080"
    environment:
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/campus_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campus123}
    extra_hosts:
      - "host.docker.internal:host-gateway"