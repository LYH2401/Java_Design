server:
  port: 8080

spring:
  application:
    name: campus-assistant
  main:
    lazy-initialization: true
    banner-mode: off

  # H2 嵌入式数据库
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/campus_assistant;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    type: com.alibaba.druid.pool.DruidDataSource
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 初始化（首次启动建表）
  sql:
    init:
      mode: embedded
      continue-on-error: true
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # Spring AI OpenAI 配置（默认：阿里云百炼兼容模式）
  # API Key 优先从前端用户输入获取；此处为占位默认值
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY:sk-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3

# DeepSeek 模型配置（独立 ChatClient）
# API Key 优先从前端用户输入获取；此处为占位默认值
deepseek:
  api-key: ${DEEPSEEK_API:sk-placeholder}
  base-url: https://api.deepseek.com
  chat:
    options:
      model: deepseek-v4-flash
      temperature: 0.7

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# SpringDoc OpenAPI（生产环境可关闭）
springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.campus: debug
