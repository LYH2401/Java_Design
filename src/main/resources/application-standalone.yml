server:
  port: 8080

spring:
  application:
    name: campus-assistant

  # H2 嵌入式数据库（MySQL兼容模式，数据文件存用户目录）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${user.home}/.campus-assistant/database;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    type: com.alibaba.druid.pool.DruidDataSource

  # H2 Web Console（调试用，生产可关闭）
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # Spring AI OpenAI 配置
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY:sk-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3

deepseek:
  api-key: ${DEEPSEEK_API:sk-placeholder}
  base-url: https://api.deepseek.com
  chat:
    options:
      model: deepseek-v4-flash
      temperature: 0.7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.campus: info
